name: eneade-fut

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eneade_fut}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eneade_fut}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-secret-1234567890}
      INITIAL_POINTS: ${INITIAL_POINTS:-50}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/eneade_fut?schema=public}
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -c "npx prisma db push --schema prisma/schema.prisma &&
             npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  postgres_data:
    external: true
    name: srcs_postgres_data
